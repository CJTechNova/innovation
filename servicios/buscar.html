<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscamos tu componente — CJ TechNova</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>…</header>

<main>
  <section class="section">
    <h2>¿Buscas una pieza específica?</h2>
    <p>Si no encuentras el componente que buscas en nuestra tienda, pregúntanos. Podemos localizarlo y prepararte un presupuesto personalizado.</p>

    <form class="form">
      <label>¿Qué buscas?</label>
      <input type="text" placeholder="Ej: RTX 4070 Super">

      <label>Categoría</label>
      <select>
        <option>Tarjeta gráfica</option>
        <option>Procesador</option>
        <option>Placa base</option>
        <option>RAM</option>
        <option>SSD</option>
      </select>

      <label>Nuevo o segunda mano</label>
      <select>
        <option>Cualquiera</option>
        <option>Nuevo</option>
        <option>Segunda mano</option>
      </select>

      <label>Presupuesto aproximado</label>
      <input type="number" placeholder="Ej: 500">

      <label>Información adicional</label>
      <textarea></textarea>

      <button class="btn">Enviar solicitud</button>
    </form>
  </section>
</main>

<footer>…</footer>

</body>
</html>
