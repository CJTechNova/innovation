</header>

<main>
  <section class="section">
    <h2>Contacto</h2>
    <p>Rellena el formulario y nos pondremos en contacto contigo.</p>

    <form action="#" method="post" class="form">

      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

      <label for="whatsapp">WhatsApp</label>
      <input type="text" id="whatsapp" name="whatsapp" placeholder="Número de teléfono" required>

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" placeholder="tuemail@correo.com" required>

      <label for="servicio">Servicio que necesitas</label>
      <select id="servicio" name="servicio" required>
        <option value="">Selecciona una opción</option>
        <option value="asesoria">Asesoría técnica</option>
        <option value="presupuesto">Presupuesto personalizado</option>
        <option value="buscar">Buscar componente</option>
        <option value="vender">Vender hardware</option>
      </select>

      <label for="mensaje">Mensaje adicional</label>
      <input type="text" id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..." required>

      <button type="submit" class="btn">Enviar mensaje</button>

    </form>

  </section>
</main>

<footer class="footer">
  <div class="container footer-content">

    <div class="footer-logo">

</body>
</html>
